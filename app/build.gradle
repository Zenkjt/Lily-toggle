plugins { id 'com.android.application' }

android {
    namespace 'com.den.lilytoggle'
    compileSdk 35

    defaultConfig {
        applicationId 'com.den.lilytoggle'
        minSdk 26
        targetSdk 28
        versionCode 1
        versionName '1.0'
    }

    // X04G is armeabi-v7a. This APK deliberately contains only 32-bit native ABI
    // metadata if native libraries are ever added; the current app is pure Java.
    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
